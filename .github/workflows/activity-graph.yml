name: Activity Graph Generation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activity-graph.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate dark activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/activity-graph-dark.svg
          options: >-
            {"bg_color":"FFFFFF00","border_color":"3F3F39","color":"FAF9F5","title_color":"60CFC7","line":"39C5BB","point":"60CFC7","area_color":"39C5BB","area":true,"custom_title":"「𝐂𝐨𝐧𝐭𝐫𝐢𝐛𝐮𝐭𝐢𝐨𝐧 𝐆𝐫𝐚𝐩𝐡」","radius":18}

      - name: Generate light activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/activity-graph-light.svg
          options: >-
            {"bg_color":"FFFFFF00","border_color":"DEDCD2","color":"6F6E68","title_color":"141413","line":"39C5BB","point":"30A79F","area_color":"39C5BB","area":true,"custom_title":"「𝐂𝐨𝐧𝐭𝐫𝐢𝐛𝐮𝐭𝐢𝐨𝐧 𝐆𝐫𝐚𝐩𝐡」","radius":18}

      - name: Validate generated SVGs
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for filename in ("activity-graph-dark.svg", "activity-graph-light.svg"):
              path = Path("dist") / filename
              try:
                  root = ET.fromstring(path.read_text(encoding="utf-8"))
              except (OSError, ET.ParseError) as error:
                  print(f"Invalid generated SVG {path}: {error}", file=sys.stderr)
                  sys.exit(1)
              if root.tag.rsplit("}", 1)[-1] != "svg":
                  print(f"Generated file is not an SVG: {path}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Push activity-graph SVGs to the out/activity-graph branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: out/activity-graph
          build_dir: dist
          commit_message: "ci(activity-graph): deploy"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
