name: GitHub Stats Generation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-stats.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: dist/github-stats-dark.svg
          token: ${{ secrets.PAT_1 }}
          fail_on_error: "true"
          options: >-
            username=Sn0wo2&title_color=F5A9B8&text_color=FFFFFF&icon_color=5BCEFA&border_color=F5A9B866&theme=transparent&border_radius=16&hide_rank=true&show_icons=true&include_all_commits=true&custom_title=%E3%80%8C%F0%9D%90%86%F0%9D%90%A2%F0%9D%90%AD%F0%9D%90%87%F0%9D%90%AE%F0%9D%90%9B%20%F0%9D%90%92%F0%9D%90%AD%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%AC%E3%80%8D&show=reviews%2Cprs_merged%2Cprs_merged_percentage

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: dist/github-stats-light.svg
          token: ${{ secrets.PAT_1 }}
          fail_on_error: "true"
          options: >-
            username=Sn0wo2&title_color=1F2328&text_color=59636E&icon_color=5BCEFA&border_color=F5A9B8&theme=transparent&border_radius=16&hide_rank=true&show_icons=true&include_all_commits=true&custom_title=%E3%80%8C%F0%9D%90%86%F0%9D%90%A2%F0%9D%90%AD%F0%9D%90%87%F0%9D%90%AE%F0%9D%90%9B%20%F0%9D%90%92%F0%9D%90%AD%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%AC%E3%80%8D&show=reviews%2Cprs_merged%2Cprs_merged_percentage

      - name: Generate dark top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: dist/top-langs-dark.svg
          token: ${{ secrets.PAT_1 }}
          fail_on_error: "true"
          options: >-
            username=Sn0wo2&title_color=F5A9B8&text_color=FFFFFF&icon_color=5BCEFA&border_color=F5A9B866&theme=transparent&border_radius=16&layout=compact&langs_count=8&custom_title=%E3%80%8C%F0%9D%90%8C%F0%9D%90%A8%F0%9D%90%AC%F0%9D%90%AD%20%F0%9D%90%94%F0%9D%90%AC%F0%9D%90%9E%F0%9D%90%9D%20%F0%9D%90%8B%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%A0%F0%9D%90%AE%F0%9D%90%9A%F0%9D%90%A0%F0%9D%90%9E%F0%9D%90%AC%E3%80%8D&show_icons=true

      - name: Generate light top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: dist/top-langs-light.svg
          token: ${{ secrets.PAT_1 }}
          fail_on_error: "true"
          options: >-
            username=Sn0wo2&title_color=1F2328&text_color=59636E&icon_color=5BCEFA&border_color=F5A9B8&theme=transparent&border_radius=16&layout=compact&langs_count=8&custom_title=%E3%80%8C%F0%9D%90%8C%F0%9D%90%A8%F0%9D%90%AC%F0%9D%90%AD%20%F0%9D%90%94%F0%9D%90%AC%F0%9D%90%9E%F0%9D%90%9D%20%F0%9D%90%8B%F0%9D%90%9A%F0%9D%90%A7%F0%9D%90%A0%F0%9D%90%AE%F0%9D%90%9A%F0%9D%90%A0%F0%9D%90%9E%F0%9D%90%AC%E3%80%8D&show_icons=true

      - name: Validate generated SVGs
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for filename in ("github-stats-dark.svg", "github-stats-light.svg", "top-langs-dark.svg", "top-langs-light.svg"):
              path = Path("dist") / filename
              try:
                  root = ET.fromstring(path.read_text(encoding="utf-8"))
              except (OSError, ET.ParseError) as error:
                  print(f"Invalid generated SVG {path}: {error}", file=sys.stderr)
                  sys.exit(1)
              if root.tag.rsplit("}", 1)[-1] != "svg":
                  print(f"Generated file is not an SVG: {path}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Push github-stats SVGs to the out/github-stats branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: out/github-stats
          build_dir: dist
          commit_message: "ci(github-stats): deploy"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
